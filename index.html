<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ルミちゃん革命戦線</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #120909, #1a1a1a);
    color: #f7f1e8;
    text-align: center;
  }

  .game {
    max-width: 760px;
    margin: auto;
    padding: 14px;
    min-height: 100vh;
  }

  h1 {
    font-size: 1.55rem;
    margin: 12px 0 8px;
    letter-spacing: 0.04em;
  }

  .panel {
    background: rgba(20, 20, 20, 0.88);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }

  #mainImage {
    display: block;
    max-width: 100%;
    max-height: 42vh;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 14px;
    margin: 10px auto 14px;
    background: #080808;
  }

  #status {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 8px 0 12px;
    font-size: 0.9rem;
  }

  .stat {
    background: #2a2020;
    border-radius: 10px;
    padding: 8px;
  }

  #text {
    background: #221919;
    padding: 15px;
    border-radius: 12px;
    line-height: 1.75;
    margin-bottom: 14px;
    text-align: left;
    white-space: pre-line;
  }

  .choices {
    display: grid;
    gap: 10px;
  }

  button {
    width: 100%;
    font-size: 16px;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    background: #a00000;
    color: white;
    font-weight: 700;
    cursor: pointer;
  }

  button:hover { filter: brightness(1.12); }
  button:active { transform: scale(0.985); }

  .small {
    margin-top: 12px;
    opacity: 0.7;
    font-size: 0.82rem;
  }
</style>
</head>
<body>

<div class="game">
  <h1>ルミちゃん革命戦線 ☭</h1>

  <div class="panel">
    <img id="mainImage" src="assets/rumi.png" alt="main image">

    <div id="status">
      <div class="stat">好感度 <span id="like">0</span></div>
      <div class="stat">兵站 <span id="supply">5</span></div>
      <div class="stat">警戒 <span id="risk">0</span></div>
    </div>

    <div id="text"></div>
    <div id="choices" class="choices"></div>
  </div>

  <div class="small">画像が出ない時は、assets/rumi.png の名前を確認。</div>
</div>

<script>
let state = {
  like: 0,
  supply: 5,
  risk: 0
};

const scenes = {
  start: {
    text: "夜の街に赤い月が昇る。\n汝はルミちゃん革命戦線の臨時指揮官となった。\n初動を誤れば戦線は崩れる。",
    choices: [
      { text: "ルミちゃんに丁寧に挨拶する", next: "greet", like: 1 },
      { text: "革命ビラを配る", next: "leaflet", risk: 1 },
      { text: "補給線を確認する", next: "supplyCheck", supply: 1 },
      { text: "いったん観察する", next: "observe" }
    ]
  },

  greet: {
    text: "ルミちゃんは静かに笑った。\n『同志、まずは信頼関係よ』\n前線に微風が吹く。",
    choices: [
      { text: "相手の話をよく聞く", next: "listen", like: 2 },
      { text: "自分語りを始める", next: "selfTalk", risk: 1 },
      { text: "軽い菓子を渡す", next: "smallGift", like: 1, supply: -1 },
      { text: "戻る", next: "start" }
    ]
  },

  listen: {
    text: "聞く姿勢は強い。\n沈黙を恐れず、相手のテンポを待った。\nこれは会話の縦深防御である。",
    choices: [
      { text: "さらに質問する", next: "deepTalk", like: 2 },
      { text: "冗談を入れる", next: "joke", risk: 1 },
      { text: "今日は短く切り上げる", next: "goodEnd" }
    ]
  },

  selfTalk: {
    text: "やや喋りすぎた。\n情報量が多すぎて、前線通信が渋滞している。",
    choices: [
      { text: "素直に謝って聞き役に戻る", next: "listen", like: 1 },
      { text: "さらに押す", next: "badEnd", risk: 2 },
      { text: "撤退する", next: "retreat" }
    ]
  },

  smallGift: {
    text: "軽い贈り物は成功。\n高価すぎないため、政治的負債にならなかった。",
    choices: [
      { text: "会話へ移行する", next: "listen", like: 1 },
      { text: "さらに贈り物を重ねる", next: "heavyGift", supply: -2, risk: 1 },
      { text: "撤退する", next: "retreat" }
    ]
  },

  heavyGift: {
    text: "重い。\n好意ではなく圧力として解釈される危険が出た。",
    choices: [
      { text: "すぐ軽く謝る", next: "listen", like: 1 },
      { text: "見返りを期待する", next: "badEnd", risk: 3 }
    ]
  },

  leaflet: {
    text: "ビラは風に舞い、数人が振り返る。\n宣伝戦は成功しつつあるが、警戒も上がる。",
    choices: [
      { text: "短く演説する", next: "shortSpeech", like: 1 },
      { text: "長く演説する", next: "longSpeech", risk: 2, supply: -1 },
      { text: "SNSにも投稿する", next: "sns", risk: 1 },
      { text: "撤収する", next: "retreat" }
    ]
  },

  shortSpeech: {
    text: "短い演説は刺さった。\n燃費がよく、騒音も少ない。優秀な小口径砲である。",
    choices: [
      { text: "ルミちゃんに報告する", next: "greet", like: 1 },
      { text: "補給へ向かう", next: "supplyCheck", supply: 1 },
      { text: "勝利宣言する", next: "goodEnd" }
    ]
  },

  longSpeech: {
    text: "長すぎた。\n聴衆の半分はラーメン屋を見ている。",
    choices: [
      { text: "短く締め直す", next: "shortSpeech" },
      { text: "さらに続ける", next: "badEnd", risk: 3 },
      { text: "SNSへ逃がす", next: "sns" }
    ]
  },

  sns: {
    text: "投稿は少し伸びた。\n革命はアルゴリズムとの戦いでもある。",
    choices: [
      { text: "一投稿で止める", next: "goodEnd", like: 1 },
      { text: "連投する", next: "badEnd", risk: 3 },
      { text: "ルミちゃんに見せる", next: "deepTalk", like: 1 }
    ]
  },

  supplyCheck: {
    text: "残金、通信量、食料、気力を点検した。\n兵站は細いが、まだ切れていない。",
    choices: [
      { text: "節約作戦を発動", next: "savePlan", supply: 2 },
      { text: "コンビニへ進軍", next: "store", supply: -1 },
      { text: "Wi-Fi圏へ移動", next: "wifi", supply: 1 },
      { text: "最初へ戻る", next: "start" }
    ]
  },

  savePlan: {
    text: "節約成功。\n支出を抑え、行動余力を確保した。\nこれは現代生活の持久戦である。",
    choices: [
      { text: "ルミちゃんへ向かう", next: "greet", like: 1 },
      { text: "さらに節制する", next: "goodEnd", supply: 1 },
      { text: "気晴らしにSNSを見る", next: "sns", risk: 1 }
    ]
  },

  store: {
    text: "コンビニは便利だが単価が高い。\n補給速度は高いが、継戦能力を削る。",
    choices: [
      { text: "最低限だけ買う", next: "savePlan", supply: 1 },
      { text: "豪遊する", next: "badEnd", supply: -3 },
      { text: "水だけ買う", next: "wifi" }
    ]
  },

  wifi: {
    text: "Wi-Fi圏に到達。\n通信弾薬の消費を抑えた。これは小さな勝利だ。",
    choices: [
      { text: "GitHubを更新する", next: "goodEnd" },
      { text: "動画を見すぎる", next: "badEnd", risk: 2 },
      { text: "ルミちゃんに連絡する", next: "greet", like: 1 }
    ]
  },

  observe: {
    text: "観察は情報戦の基本。\n焦らず相手の癖、空気、距離感を測る。",
    choices: [
      { text: "今なら話しかける", next: "greet", like: 1 },
      { text: "もう少し観察する", next: "deepObserve" },
      { text: "撤退する", next: "retreat" }
    ]
  },

  deepObserve: {
    text: "観察しすぎた。\n慎重さは武器だが、機会損失も発生する。",
    choices: [
      { text: "勇気を出して挨拶", next: "greet", like: 1 },
      { text: "何もせず帰る", next: "retreat" },
      { text: "SNSだけ見る", next: "sns", risk: 1 }
    ]
  },

  deepTalk: {
    text: "会話は深まった。\n相手の話を尊重し、自分の温度を少しだけ出した。",
    choices: [
      { text: "ここで切り上げる", next: "goodEnd", like: 1 },
      { text: "次の約束を軽く提案", next: "promise", like: 2 },
      { text: "急に距離を詰める", next: "badEnd", risk: 3 }
    ]
  },

  promise: {
    text: "軽い提案は通った。\n圧力をかけない約束は、維持費が低く成功率が高い。",
    choices: [
      { text: "勝利エンドへ", next: "trueEnd", like: 1 },
      { text: "調子に乗る", next: "badEnd", risk: 2 }
    ]
  },

  joke: {
    text: "冗談は少し滑った。\n空気がシベリヤ送り寸前まで冷える。",
    choices: [
      { text: "すぐ謝る", next: "listen", like: 1 },
      { text: "押し通す", next: "badEnd", risk: 3 },
      { text: "撤退する", next: "retreat" }
    ]
  },

  retreat: {
    text: "撤退は敗北ではない。再編成である。\n弾薬、燃料、士気を整えれば再出撃できる。",
    choices: [
      { text: "再出撃する", next: "start" },
      { text: "補給線を確認する", next: "supplyCheck", supply: 1 }
    ]
  },

  goodEnd: {
    text: "小勝利。\n戦線は維持された。\n派手ではないが、こういう成功が一番強い。",
    choices: [
      { text: "もう一度遊ぶ", next: "reset" }
    ]
  },

  trueEnd: {
    text: "大勝利。\n距離感、補給、警戒管理が噛み合った。\n革命戦線は無理なく前進した。",
    choices: [
      { text: "最初から遊ぶ", next: "reset" }
    ]
  },

  badEnd: {
    text: "作戦失敗。\n原因は押しすぎ、消費しすぎ、警戒上昇のどれかだ。\nだが再起動できる者は強い。",
    choices: [
      { text: "再起動する", next: "reset" }
    ]
  }
};

function updateStatus() {
  document.getElementById("like").textContent = state.like;
  document.getElementById("supply").textContent = state.supply;
  document.getElementById("risk").textContent = state.risk;
}

function apply(choice) {
  state.like += choice.like || 0;
  state.supply += choice.supply || 0;
  state.risk += choice.risk || 0;

  if (state.supply <= 0) {
    showScene("badEnd");
    return;
  }
  if (state.risk >= 6) {
    showScene("badEnd");
    return;
  }
  if (choice.next === "reset") {
    state = { like: 0, supply: 5, risk: 0 };
    showScene("start");
    return;
  }
  showScene(choice.next);
}

function showScene(id) {
  const scene = scenes[id];
  document.getElementById("text").textContent = scene.text;

  const choicesDiv = document.getElementById("choices");
  choicesDiv.innerHTML = "";

  scene.choices.forEach(choice => {
    const btn = document.createElement("button");
    btn.textContent = choice.text;
    btn.onclick = () => apply(choice);
    choicesDiv.appendChild(btn);
  });

  updateStatus();
}

showScene("start");
</script>

</body>
</html>
